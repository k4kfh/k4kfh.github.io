project_entries:
  - title: QUCS-S Documentation
    url: https://qucs-s-help.readthedocs.io/en/latest/
    desc: I contributed to the content and the underlying infrastructure of the documentation for this excellent mixed-signal circuit simulator.

  - title: ER32 Spindle for Taig Micro Lathe
    url: https://www.youtube.com/watch?v=BCkW2dN5M6A
    desc: As an upgrade for my Taig Micro Lathe, I designed and manufactured an ER32 spindle from scratch, using a set of Nachi angular contact bearings.

  - title: The Hardware Store Steam Boiler
    url: nonexistent
    desc: I built a water-tube steam boiler with no machining, and minimal silver soldering, based on a late-60s Popular Mechanics issue.

  - title: 1:8 Scale Vertical Steam Engine
    url: nonexistent
    desc: I machined and assembled a 1:8 scale model of a 6HP vertical steam engine, using a casting kit from PM Research, Inc.

  - title: ZephyrCab
    url: overview-post
    desc: A web app with a scratch-built train physics/air brake simulation, which adds realistic throttle and brake controls to model diesel locomotives.

